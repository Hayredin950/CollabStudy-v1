{% extends 'main.html' %}
{% block content %}
<main class="py-8">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left Sidebar: Topics -->
        <aside class="hidden lg:block lg:col-span-3 space-y-6">
            {% include 'topic_component.html' %}
        </aside>

        <!-- Center: Room List -->
        <section class="lg:col-span-6 space-y-6">
            <!-- Mobile Menu -->
            <div class="lg:hidden bg-custom-card border border-custom p-4 rounded-xl mb-6">
                <form action="{% url 'home' %}" method="GET" class="relative mb-4">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center">
                        <svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </span>
                    <input type="text" name="q" placeholder="Search rooms..." 
                           class="bg-custom-dark border border-custom text-slate-200 text-sm rounded-lg block w-full pl-10 p-2.5 outline-none focus:ring-2 focus:ring-sky-500 transition-all">
                </form>
                <div class="flex gap-2">
                    <a href="{% url 'topics' %}" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 text-center py-2 rounded-lg text-sm font-medium transition-colors border border-custom">Browse Topics</a>
                    <a href="{% url 'activity' %}" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 text-center py-2 rounded-lg text-sm font-medium transition-colors border border-custom">Activity</a>
                </div>
            </div>

            <!-- Feed Header -->
            <div class="flex items-center justify-between bg-custom-card border border-custom p-5 rounded-xl shadow-lg">
                <div>
                    <h2 class="text-xl font-bold text-white tracking-tight">Active Rooms</h2>
                    <p class="text-sm text-slate-400 font-medium">{{room_count}} total rooms found</p>
                </div>
                <a href="{% url 'create_room' %}" class="inline-flex items-center px-5 py-2.5 bg-sky-500 hover:bg-sky-400 text-white text-sm font-bold rounded-lg transition-all transform hover:scale-105 shadow-lg shadow-sky-500/20">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                    Create Room
                </a>
            </div>

            <!-- Feed Component -->
            <div class="space-y-4">
                {% include 'feed_component.html' %}
            </div>
        </section>

        <!-- Right Sidebar: Activities -->
        <aside class="hidden lg:block lg:col-span-3">
            {% include 'activity_component.html' %}
        </aside>
    </div>
</main>
{% endblock %}
