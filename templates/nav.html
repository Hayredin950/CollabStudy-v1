{% load static %}
<nav class="bg-custom-card border-b border-custom sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <div class="flex items-center space-x-8">
                <a href="/" class="flex items-center space-x-2 group">
                    <img src="{% static 'images/logo-nav.png' %}" alt="CollabStudy logo" class="h-9 w-9 rounded-xl group-hover:scale-105 transition-transform">
                    <span class="text-xl font-bold text-white tracking-tight">CollabStudy</span>
                </a>

                <div class="hidden md:block">
                    {% if request.resolver_match.url_name == 'home' %}
                    <form action="{% url 'home' %}" method="GET" class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center">
                            <svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                        </span>
                        <input type="text" name="q" placeholder="Search rooms..." 
                               class="bg-custom-dark border border-custom text-slate-200 text-sm rounded-full focus:ring-sky-500 focus:border-sky-500 block w-64 pl-10 p-2 transition-all outline-none">
                    </form>
                    {% endif %}
                </div>
            </div>

            <div class="flex items-center space-x-4">
                {% if request.user.is_authenticated %}
                <div class="relative group">
                    <button class="flex items-center space-x-3 bg-slate-800/50 hover:bg-slate-800 p-1.5 pr-3 rounded-full border border-custom transition-all">
                        <img class="h-8 w-8 rounded-full object-cover border border-sky-500/50" src="{{request.user.avatar.url}}" alt="Avatar">
                        <div class="text-left hidden sm:block">
                            <p class="text-xs font-semibold text-white leading-none">{{request.user.username}}</p>
                            <p class="text-[10px] text-slate-400 mt-1">{{request.user.email}}</p>
                        </div>
                        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                    </button>
                    
                    <div class="absolute right-0 w-48 mt-2 py-2 bg-custom-card border border-custom rounded-xl shadow-2xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 transform translate-y-2 group-hover:translate-y-0">
                        <a href="{% url 'profile' request.user.id %}" class="block px-4 py-2 text-sm text-slate-300 hover:bg-sky-500 hover:text-white transition-colors">My Profile</a>
                        <a href="{% url 'update_user' %}" class="block px-4 py-2 text-sm text-slate-300 hover:bg-sky-500 hover:text-white transition-colors">Settings</a>
                        <div class="border-t border-custom my-1"></div>
                        <form action="{% url 'account_logout' %}" method="post" class="block">
                            {% csrf_token %}
                            <button type="submit" class="w-full text-left px-4 py-2 text-sm text-rose-400 hover:bg-rose-500 hover:text-white transition-colors">Sign Out</button>
                        </form>
                    </div>
                </div>
                {% else %}
                <a href="{% url 'login' %}" class="text-slate-300 hover:text-white text-sm font-medium px-4 py-2 transition-colors">Login</a>
                <a href="{% url 'register' %}" class="bg-sky-500 hover:bg-sky-400 text-white text-sm font-bold px-5 py-2 rounded-full transition-all transform hover:scale-105">Join Now</a>
                {% endif %}
            </div>
        </div>
    </div>
</nav>
