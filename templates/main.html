{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ✅ Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .bg-custom-dark { background-color: #0F172A; }
        .bg-custom-card { background-color: #1E293B; }
        .text-custom-primary { color: #38BDF8; }
        .border-custom { border-color: #334155; }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0F172A;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>

    <link rel="shortcut icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon" />
    <title>CollabStudy | Billion Dollar Collaboration Platform</title>
</head>

<body class="bg-custom-dark text-slate-200 min-h-screen">

    {% include 'nav.html' %}

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
        {% if messages %}
        <div class="space-y-2 mb-6">
            {% for message in messages %}
            <div class="bg-blue-600/20 border border-blue-500 text-blue-100 px-4 py-3 rounded-lg flex justify-between items-center animate-fade-in">
                <span>{{ message }}</span>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        {% block content %}
        {% endblock %}
    </div>

    <script src="{% static 'js/script.js' %}"></script>
</body>

</html>
