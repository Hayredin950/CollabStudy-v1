{% load i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% blocktrans %}Signing you in with {{ provider.name }}…{% endblocktrans %}</title>
    <style>
        body {
            margin: 0;
            background: #0F172A;
            color: #e2e8f0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card { text-align: center; }
        .spinner {
            width: 40px; height: 40px;
            margin: 0 auto 16px;
            border: 3px solid #1E293B;
            border-top-color: #38BDF8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        p { color: #94a3b8; font-size: 14px; }
        button {
            margin-top: 8px; padding: 8px 18px;
            background: #38BDF8; color: #0F172A;
            border: 0; border-radius: 8px; font-weight: 700; cursor: pointer;
        }
    </style>
</head>
<body>
    <form method="post" action="" id="social-login-continue">
        {% csrf_token %}
        <div class="card">
            <div class="spinner"></div>
            <p>Redirecting to {{ provider.name }}…</p>
            <noscript>
                <p>JavaScript is disabled.</p>
                <button type="submit">{% trans "Continue" %}</button>
            </noscript>
        </div>
    </form>
    <script>document.getElementById('social-login-continue').submit();</script>
</body>
</html>
