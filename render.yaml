# Render Blueprint — deploy CollabStudy v1 (Django + PostgreSQL)
# Connect this repo on https://dashboard.render.com/blueprints and Render
# will create the web service defined here automatically.
#
# Database: the app uses a Neon (serverless Postgres) database.
# DATABASE_URL is set manually in the Render dashboard Environment tab
# (NOT managed by this blueprint, so blueprint syncs never overwrite it).
#
# Free-tier notes:
# - preDeployCommand is NOT supported on free services, so migrations run at
#   startup via render.sh (idempotent) and collectstatic runs during build.
services:
  - type: web
    name: collabstudy
    runtime: python
    plan: free
    # Pin a Python version whose wheels exist for all pinned deps
    # (Django 5.2 supports 3.10-3.13; 3.13 keeps psycopg/pillow on wheels).
    pythonVersion: 3.13.3
    autoDeploy: true
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: bash render.sh
    healthCheckPath: /
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.onrender.com"
