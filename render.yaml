# Render Blueprint — deploy CollabStudy v1 (Django + PostgreSQL)
# Connect this repo on https://dashboard.render.com/blueprints and Render
# will create the web service and database defined here automatically.
#
# Free-tier notes:
# - preDeployCommand is NOT supported on free services, so migrations run at
#   startup via render.sh (idempotent) and collectstatic runs during build.
databases:
  - name: collabstudy-db
    databaseName: collabstudy
    user: collabstudy
    plan: free

services:
  - type: web
    name: collabstudy
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: bash render.sh
    healthCheckPath: /
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: collabstudy-db
          property: connectionString
